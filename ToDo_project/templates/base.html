<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ToDo App{% endblock %}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        nav {
            background-color: #2c3e50;
            padding: 1rem 2rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .nav-brand {
            display: flex;
            align-items: center;
        }
        
        .nav-brand a {
            color: white;
            text-decoration: none;
            font-size: 1.5rem;
            font-weight: bold;
        }
        
        .nav-brand a:hover {
            color: #667eea;
        }
        
        .nav-links {
            display: flex;
            gap: 1rem;
            align-items: center;
        }
        
        .nav-links a, .nav-links form {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
        }
        
        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 0.95rem;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            transition: all 0.3s;
        }
        
        .nav-links a:hover {
            background-color: rgba(255, 255, 255, 0.1);
            color: #667eea;
        }
        
        .logout-form {
            display: inline;
        }
        
        .logout-btn {
            background: none;
            border: none;
            color: white;
            font-size: 0.95rem;
            padding: 0.5rem 1rem;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s;
        }
        
        .logout-btn:hover {
            background-color: rgba(255, 255, 255, 0.1);
            color: #667eea;
        }
        
        .user-info {
            color: #fff;
            font-size: 0.9rem;
            padding: 0.5rem 0;
        }
        
        .container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        
        h1 {
            color: white;
            margin-bottom: 2rem;
            text-align: center;
        }
        
        h2 {
            color: #2c3e50;
            margin-bottom: 1.5rem;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav>
        <div class="nav-brand">
            <a href="{% url 'task_list' %}">📝 ToDo App</a>
        </div>
        <div class="nav-links">
            {% if user.is_authenticated %}
                <span class="user-info">👤 {{ user.username }}</span>
                <a href="{% url 'task_list' %}">📋 My Tasks</a>
                <a href="{% url 'profile' %}">👥 Profile</a>
                <form method="post" action="{% url 'logout' %}" class="logout-form">
                    {% csrf_token %}
                    <button type="submit" class="logout-btn">🚪 Logout</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}">🔓 Login</a>
                <a href="{% url 'register' %}">📝 Register</a>
            {% endif %}
        </div>
    </nav>
    
    <div class="container">
        {% include 'includes/messages.html' %}
        {% block content %}{% endblock %}
    </div>
</body>
</html>
